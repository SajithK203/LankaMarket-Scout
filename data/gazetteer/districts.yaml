# gazetteer.yaml — District and place-name lookup table
# ─────────────────────────────────────────────────────────────────────────────
# The LLM outputs district names in English. We need to map all possible
# spellings (English, Sinhala, Tamil, common variants) to one canonical
# English name so database queries are consistent.
#
# OWNER: Member C to maintain. Native speakers to add variant spellings.
# ─────────────────────────────────────────────────────────────────────────────

districts:

  - canonical: "Ampara"
    sinhala: ["අම්පාර"]
    tamil: ["அம்பாறை"]
    variants: ["Ampara", "Amparai"]
    region: "Eastern"

  - canonical: "Anuradhapura"
    sinhala: ["අනුරාධපුරය"]
    tamil: ["அனுராதபுரம்"]
    variants: ["Anuradhapura", "Anuradhapuram"]
    region: "North Central"
    prototype: true   # included in prototype scope

  - canonical: "Badulla"
