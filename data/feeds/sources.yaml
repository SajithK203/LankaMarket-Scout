# sources.yaml — list of RSS feeds to collect from
# Format: each entry has name, url, language, section, status, notes
#
# STATUS KEY:
#   verified   = tested from our network, returns items  ✅
#   empty      = feed responds HTTP 200 but returned 0 items (investigate URL)
#   blocked    = tested, returns 403/401 — not accessible from this network
#   dead       = tested, returns 404 — URL no longer exists
#   no_url     = RSS URL not yet found; search manually
#   skip       = deliberately excluded from collection
#
# TESTED: 2026-10-22 from campus/home network
# Result: 13/22 responding | 7 with items | 6 empty | 4 blocked/dead | 5 no URL

