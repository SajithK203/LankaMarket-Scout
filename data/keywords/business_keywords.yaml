  - விவசாயம்     # farming
  - சுற்றுலா      # tourism
  - முதலீடு       # investment
  - வணிகம்       # business / trade
  - கடன்          # loan
  - வெள்ளம்      # flood
  - வறட்சி        # drought
  - சந்தை         # market
  - கட்டுமானம்   # construction
