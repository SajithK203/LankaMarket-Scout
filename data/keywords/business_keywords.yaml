# Business Keywords — Three Languages
# ─────────────────────────────────────────────────────────────────────────────
# Stage 4 of the pipeline: before paying for LLM extraction, check each
# headline for at least one keyword from this list. Items with no match
# are dropped (they are almost certainly not business-relevant).
#
# HOW TO EDIT THIS FILE:
#   - Add words in their base form where possible.
#   - For Sinhala and Tamil, Sinhala/Tamil speakers MUST verify and extend
#     this list — words change form a lot (inflection).
#   - One word/phrase per line. Comments start with #.
#   - Keep this file in Git so everyone's edits are shared.
#
# OWNER: Member C (initial list) + native speaker team members (review)
# UPDATED: 2026-10-30 — expanded all three language lists (filter was dropping 84% of items)
# ─────────────────────────────────────────────────────────────────────────────

