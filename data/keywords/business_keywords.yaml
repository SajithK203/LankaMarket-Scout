  - road
  - highway
  - port
  - electricity cut
  - power cut
  - railway
  # Disasters / weather (affect business conditions)
  - flood
  - drought
  - cyclone
  - landslide
  # Regulations
  - regulation
  - license
  - permit
  - ban
  - policy
  - reform
  - development

